<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0F243E" />
      <stop offset="60%" stop-color="#071426" />
      <stop offset="100%" stop-color="#040B15" />
    </radialGradient>

    <!-- P Loop Gradient -->
    <linearGradient id="pGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Node Glow Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Central Star Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />

  <!-- Connecting Node Filaments -->
  <!-- Upper Filament -->
  <path d="M 180 160 C 210 185, 240 215, 275 230" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" opacity="0.85" />
  <!-- Center Filament -->
  <path d="M 150 250 C 200 250, 240 265, 280 270" fill="none" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" opacity="0.95" />
  <!-- Lower Filament -->
  <path d="M 185 330 C 215 315, 250 300, 290 280" fill="none" stroke="#818CF8" stroke-width="6" stroke-linecap="round" opacity="0.85" />

  <!-- Node Dots -->
  <circle cx="180" cy="160" r="16" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle cx="150" cy="250" r="20" fill="url(#cyanGlow)" filter="url(#glow)" />
  <circle cx="185" cy="330" r="15" fill="url(#blueGlow)" filter="url(#glow)" />

  <!-- Main 'P' Loop and Stem -->
  <!-- Stem -->
  <path d="M 230 140 L 270 140 L 270 380 C 270 395, 255 400, 245 400 C 235 400, 230 395, 230 380 Z" fill="url(#pGradient)" />

  <!-- Outer Loop of P -->
  <path d="M 245 140 C 330 140, 395 190, 395 265 C 395 340, 330 385, 255 385 C 240 385, 230 380, 230 380 C 285 365, 345 325, 345 265 C 345 205, 300 175, 245 175 Z" fill="url(#pGradient)" filter="url(#glow)" />

  <!-- Central Star / Light -->
  <path d="M 315 225 Q 315 245, 335 245 Q 315 245, 315 265 Q 315 245, 295 245 Q 315 245, 315 225 Z" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="315" cy="245" r="4" fill="#E0F2FE" />
</svg>
