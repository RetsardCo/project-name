<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="20%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F243E" />
      <stop offset="60%" stop-color="#071426" />
      <stop offset="100%" stop-color="#040B15" />
    </radialGradient>

    <!-- P Loop Gradient -->
    <linearGradient id="pGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="textCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="800" height="240" rx="36" fill="url(#bgGlow)" />

  <!-- Symbol Group (Left Aligned, scaled down to 180x180 at x=30, y=30) -->
  <g transform="translate(30, 30) scale(0.35)">
    <!-- Filaments -->
    <path d="M 180 160 C 210 185, 240 215, 275 230" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" opacity="0.85" />
    <path d="M 150 250 C 200 250, 240 265, 280 270" fill="none" stroke="#22D3EE" stroke-width="10" stroke-linecap="round" opacity="0.95" />
    <path d="M 185 330 C 215 315, 250 300, 290 280" fill="none" stroke="#818CF8" stroke-width="8" stroke-linecap="round" opacity="0.85" />

    <!-- Node Dots -->
    <circle cx="180" cy="160" r="18" fill="url(#cyanGlow)" filter="url(#glow)" />
    <circle cx="150" cy="250" r="22" fill="url(#cyanGlow)" filter="url(#glow)" />
    <circle cx="185" cy="330" r="18" fill="url(#blueGlow)" filter="url(#glow)" />

    <!-- Stem -->
    <path d="M 230 140 L 270 140 L 270 380 C 270 395, 255 400, 245 400 C 235 400, 230 395, 230 380 Z" fill="url(#pGradient)" />

    <!-- Outer Loop of P -->
    <path d="M 245 140 C 330 140, 395 190, 395 265 C 395 340, 330 385, 255 385 C 240 385, 230 380, 230 380 C 285 365, 345 325, 345 265 C 345 205, 300 175, 245 175 Z" fill="url(#pGradient)" filter="url(#glow)" />

    <!-- Central Star -->
    <path d="M 315 225 Q 315 245, 335 245 Q 315 245, 315 265 Q 315 245, 295 245 Q 315 245, 315 225 Z" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="315" cy="245" r="5" fill="#E0F2FE" />
  </g>

  <!-- Typography: Peerlight Wordmark -->
  <text x="240" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#FFFFFF">Peer</tspan><tspan fill="url(#textCyan)">light</tspan>
  </text>
  <text x="245" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#9AAAC0" letter-spacing="1.2">
    REMOTE DEVICE ACCESS &amp; CONTROL
  </text>
</svg>
